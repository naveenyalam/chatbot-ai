name: NOVA AI Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    name: 1. Backend Security & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest app/tests/ -v --tb=short

  frontend-build:
    name: 2. Frontend Type Check & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Static Check
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-validate-and-build:
    name: 3. Docker Compose & Image Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: nova-ai-backend:test

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nova-ai-frontend:test

  migration-check:
    name: 4. Database Migration Revision Check
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Head Revision
        run: |
          cd backend
          alembic current || alembic heads

  cloud-deploy-stage:
    name: 5. Cloud Production Deployment Stage
    runs-on: ubuntu-latest
    needs: [docker-validate-and-build, migration-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Production Secrets & Trigger Cloud Deployment
        run: |
          if [ -z "${{ secrets.CLOUD_DEPLOY_HOST }}" ]; then
            echo "::warning title=Cloud Secrets Pending::CLOUD_DEPLOY_HOST secret is not configured. Marking cloud deployment stage as pending."
            exit 0
          fi
          echo "Executing production container deployment to target host: ${{ secrets.CLOUD_DEPLOY_HOST }}"
          # SSH or Cloud CLI deployment script execution placeholder

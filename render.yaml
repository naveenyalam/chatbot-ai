# Render Blueprint deployment configuration for NOVA AI Backend
services:
  - type: web
    name: nova-ai-backend
    env: python
    region: singapore # Change to your preferred region (e.g. oregon, frankfurt)
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENV_MODE
        value: production
      - key: LLM_PROVIDER
        value: openai # or openrouter / groq / together
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUD_LLM_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://YOUR_DOMAIN.com
